[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "langchain-layrcake"
version = "0.1.0"
description = "LangChain tools for Layrcake: find leads, enrich and verify emails, check and research companies, and draft campaigns that a person approves before anything sends."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Layrcake", email = "founders@layrcake.dev" }]
requires-python = ">=3.10,<4.0"
dependencies = [
    "langchain-core>=1.0.0,<2.0.0",
    "layrcake[agents]>=0.2.0,<0.3.0",
    "pydantic>=2.7,<3",
]
keywords = ["langchain", "layrcake", "agents", "tools", "sales", "lead-generation", "email-verification"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://layrcake.dev"
Documentation = "https://github.com/Layrcake-dev/langchain-layrcake#readme"
Source = "https://github.com/Layrcake-dev/langchain-layrcake"
Issues = "https://github.com/Layrcake-dev/langchain-layrcake/issues"

[dependency-groups]
dev = [
    "langchain-tests>=1.1.9,<2",
    "pytest>=9.1",
    "pytest-socket>=0.7",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
    "mypy>=2.4",
]

[tool.hatch.build.targets.wheel]
packages = ["langchain_layrcake"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls the real Layrcake API with dry_run (needs LAYRCAKE_API_KEY)"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["langchain_layrcake", "tests"]
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PT", "RET", "D"]
ignore = ["UP045", "UP007", "D105", "D107", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "RUF012"]

# Local development only, until layrcake 0.2.0 (which adds layrcake.agent_tools) is on PyPI.
# uv installs the SDK from the sibling checkout below and uv.lock records that path, so
# `uv lock --check` and `uv sync --locked` match what was tested. pip ignores this table, and the
# built package's metadata already requires the released SDK. Before publishing: release layrcake
# 0.2.0, delete this table, run `uv lock`, and commit the new lock.
[tool.uv.sources]
layrcake = { path = "../../layrcake-python", editable = true }
